<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hoobot · bots</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ccircle cx='64' cy='64' r='64' fill='%23E4762B'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">hoobot</span>
        </div>
        <ul class="bots" id="bots" role="list"></ul>
        <button class="btn primary block" id="new-bot" type="button">New bot</button>
        <p class="side-foot" id="runtime-note"></p>
      </aside>

      <main class="main" id="main">
        <div class="placeholder" id="placeholder">
          <p class="placeholder-title">No bot selected</p>
          <p class="placeholder-sub">Pick one on the left, or make a new one.</p>
        </div>

        <div class="detail" id="detail" hidden>
          <header class="detail-head">
            <img class="avatar-xl" id="d-avatar" alt="" />
            <div class="titles">
              <h1 id="d-name">—</h1>
              <p class="sub" id="d-status">—</p>
            </div>
            <div class="head-actions">
              <button class="btn ghost" id="btn-restart" type="button" title="Stop and start again">Restart</button>
              <button class="btn" id="btn-toggle" type="button">Start</button>
            </div>
          </header>

          <section class="card" id="health-card">
            <div class="card-head">
              <h2>Status</h2>
              <span class="hint" id="d-port"></span>
            </div>
            <div class="status-grid" id="health-grid"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>Settings</h2>
              <span class="hint" id="save-hint">Saved to runtime/&lt;bot&gt;/.env</span>
            </div>
            <div id="settings"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>Activity</h2>
              <span class="hint" id="log-meta"></span>
            </div>
            <pre class="log" id="log">No log yet.</pre>
          </section>
        </div>
      </main>
    </div>

    <!-- New bot: one sheet, everything on it. -->
    <div class="sheet-backdrop" id="sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head">
          <h2 id="sheet-title">New bot</h2>
          <button class="icon-btn" id="sheet-close" type="button" aria-label="Close">×</button>
        </div>

        <div class="sheet-body">
          <section class="field-block identity">
            <div class="identity-art">
              <img class="avatar-xl" id="n-avatar" alt="the bot's face" />
              <div class="identity-art-actions">
                <button class="btn tiny" id="n-reroll-face" type="button">Shuffle face</button>
                <div class="segmented" id="n-shape" role="group" aria-label="Shape">
                  <button type="button" data-shape="circle" class="on">Circle</button>
                  <button type="button" data-shape="squircle">Square</button>
                </div>
              </div>
              <div class="swatches" id="n-palette" role="group" aria-label="Colour"></div>
            </div>

            <div class="identity-fields">
              <label class="field">
                <span class="label">Name</span>
                <div class="row">
                  <input id="n-name" type="text" autocomplete="off" spellcheck="false" placeholder="pepper" />
                  <button class="btn tiny" id="n-reroll-name" type="button">Shuffle</button>
                </div>
                <span class="hint" id="n-name-hint">Lowercase, dashes, no spaces.</span>
              </label>
            </div>
          </section>

          <section class="field-block">
            <h3>Chats</h3>
            <div class="choices" id="n-surfaces"></div>
            <p class="hint" id="n-token-hint"></p>
            <div id="n-tokens"></div>
          </section>

          <section class="field-block">
            <h3>Workspace</h3>
            <label class="field">
              <span class="label">Working folder</span>
              <input id="n-workdir" type="text" spellcheck="false" placeholder="runtime/shared/workspace" />
              <span class="hint">Where hoocode reads and writes. Sharing a folder lets bots see each other's files.</span>
            </label>
          </section>
        </div>

        <div class="sheet-foot">
          <span class="err" id="n-error"></span>
          <div class="grow"></div>
          <button class="btn ghost" id="sheet-cancel" type="button">Cancel</button>
          <button class="btn primary" id="n-create" type="button">Create bot</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
